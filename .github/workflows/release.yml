name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Get version from version.py
      id: get_version
      run: |
        $version = (Get-Content version.py | Select-String '__version__ = "(.*)"').Matches.Groups[1].Value
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "version=$version" >> $env:GITHUB_OUTPUT
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "ChatList-v$env:VERSION" --icon app.ico main.py
        
    - name: Install Inno Setup
      run: |
        $innoUrl = "https://jrsoftware.org/download.php/is.exe"
        $innoPath = "$env:TEMP\innosetup.exe"
        Invoke-WebRequest -Uri $innoUrl -OutFile $innoPath
        Start-Process -FilePath $innoPath -ArgumentList "/SILENT" -Wait
        
    - name: Build installer
      run: |
        $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (Test-Path $isccPath) {
          & $isccPath setup.iss
        } else {
          Write-Host "Inno Setup not found, skipping installer build"
        }
        
    - name: Create release archive
      run: |
        New-Item -ItemType Directory -Path "release" -Force
        Copy-Item "dist\ChatList-v$env:VERSION.exe" -Destination "release\" -ErrorAction SilentlyContinue
        Copy-Item "installer\ChatList-Setup-v$env:VERSION.exe" -Destination "release\" -ErrorAction SilentlyContinue
        Copy-Item "README.md" -Destination "release\"
        Copy-Item "LICENSE" -Destination "release\"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-files
        path: release/*
        
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        body_path: RELEASE_NOTES_TEMPLATE.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

